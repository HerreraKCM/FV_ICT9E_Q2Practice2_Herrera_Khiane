<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Practice 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        h1 {
            font-family: 'Creepster', cursive;
            font-size: 50px;
            color: #e2ddda;
            background-color: #5e2109;
            border-radius: 10px;
            box-shadow: 5px 5px 10px rgba(236, 234, 234, 0.787);

        }
        body {
            background-image: url('https://i.pinimg.com/736x/72/61/35/72613517616ef6649ccb1848c252a270.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff;
        }
        #table1{
            background-color: rgba(179, 99, 20, 0.799);
            box-shadow: 5px 5px 10px rgba(16, 0, 0, 0.5);
            padding: 20px;
        }
        td, th {
            border: 1px solid #fff;
            font-family: 'Chilled';
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-lg-8 text-center mx-auto">
                <h1 class="text-center">Emeraldians Halloween Party '26</h1>
            </div>
        </div>

    <br>
            <img src="https://i.pinimg.com/originals/7f/9e/2a/7f9e2af87eaa3dec56c92874226d816a.gif" id="halloween" alt="halloween" class="img-fluid mx-auto d-block" style="height: 400px; width: 500px; border-radius: 5%; box-shadow: 0 0 10px rgba(0, 0, 0, 0.81);">

    <br>

        <div class="row justify-content-center mx-auto">
            <div class="col-lg-8" id="table1">
                <table class="table-hover table-bordered align-middle text-center mx-auto" style="width: 100%; box-shadow: 5px 5px 10px rgba(16, 0, 0, 0.5);">
                    <thead>
                        <tr class="display-5">
                            <th scope="col"> SATURDAY </th>
                            <th scope="col">31<sup>st</sup></th>
                            <th scope="col">OCTOBER</th>
                        </tr>
                    </thead>
                    
                    <tbody>
                        <tr class="display-6" id="row2">
                            <td colspan="3">12:00 - 4:00 AM</td>
                        </tr>
                        <tr class="display-6" id="row3">
                            <td colspan="2"> 4350 Victoria Park Drive</td>
                            <td>RSVP</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
</body>
</html>
